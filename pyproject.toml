[project]
name = "rag-eval-retrieval-vs-generation"
version = "0.1.0"
description = "A RAG evaluation that measures retrieval and generation separately, and finds a case where generation faithfulness improves while retrieval recall gets worse."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
